[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plomfact-ecf"
version = "0.1.0"
description = "PlomFact e-CF: módulo de integración fiscal con la DGII (República Dominicana)"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "lxml>=5",
  "xmlsec>=1.3.14",
  "requests>=2.31",
  "qrcode>=7.4",
  "reportlab>=4",
]

[project.optional-dependencies]
test = ["pytest>=8", "signxml>=4"]

[project.scripts]
plomfact-ecf = "plomfact_ecf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
